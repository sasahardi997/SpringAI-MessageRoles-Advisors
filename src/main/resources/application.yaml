spring:
  application:
    name: messageroles
  ai:
    openai:
      api-key: dummy-not-required
      chat:
        base-url: http://localhost:12434/v1
        options:
          model: llama3.2
logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
